name: Canonical CEL and generic Call connector compatibility
on:
  push:
    branches: [main]
  pull_request:

jobs:
  google-yaml-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: sbt/setup-sbt@v1
      - name: Verify standard CEL emission and generic Google Call mapping
        run: sbt -batch 'Test / runMain us.awfl.yaml.GenericCallNamesSmoke'
